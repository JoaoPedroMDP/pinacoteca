<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pinacoteca</title>
  <link rel="stylesheet" href="/app/board.css">
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-tabs" role="tablist">
      <button type="button" class="sidebar-tab" role="tab" data-tab="screens"
        id="sidebar-tab-screens" aria-selected="true" aria-controls="tab-screens">Telas</button>
      <button type="button" class="sidebar-tab" role="tab" data-tab="chat"
        id="sidebar-tab-chat" aria-selected="false" aria-controls="tab-chat">Conversa</button>
    </div>

    <div id="tab-screens" role="tabpanel" aria-labelledby="sidebar-tab-screens">
      <header class="sidebar-header">
        <h1>Telas</h1>
        <span id="screen-count" class="badge">0</span>
      </header>
      <nav id="screen-list" class="screen-list"></nav>
    </div>

    <div id="tab-chat" role="tabpanel" aria-labelledby="sidebar-tab-chat" hidden>
      <div id="chat-log">
        <p id="chat-empty" class="muted">Ainda nao ha mensagens.</p>
      </div>

      <div id="chat-queue" class="chat-queue" hidden>
        <p class="chat-queue-title">A enviar</p>
        <div id="chat-queue-list"></div>
      </div>

      <form id="chat-composer">
        <textarea id="chat-input" placeholder="Peça algo ao agente..." rows="1"></textarea>
        <div class="chat-composer-row">
          <select id="chat-model">
            <option value="claude-opus-5">claude-opus-5</option>
            <option value="claude-sonnet-5">claude-sonnet-5</option>
            <option value="claude-haiku-4-5">claude-haiku-4-5</option>
          </select>
          <select id="chat-effort">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
          <select id="chat-auto" title="Aprovacao das edicoes">
            <option value="manual">Manual</option>
            <option value="auto">Auto</option>
          </select>
          <button type="button" id="chat-stop" hidden>Parar</button>
          <span class="chat-send-wrap">
            <button type="submit" id="chat-send">Enviar</button>
            <button type="button" id="chat-send-mode" aria-pressed="false"
              title="Shift+Enter para enviar (clique para alternar)">⇧⏎</button>
          </span>
        </div>
      </form>
    </div>

    <footer class="sidebar-footer">
      <div id="root-path" class="root-path"></div>
      <div class="sidebar-status">
        <span id="connection" class="connection" data-state="connecting">conectando</span>
        <span id="version" class="version"></span>
        <button type="button" id="settings-open" class="settings-open" title="Configuracoes">⚙</button>
      </div>
    </footer>
  </aside>

  <div id="sidebar-resizer" role="separator" aria-orientation="vertical"
    aria-label="Redimensionar a barra lateral"></div>

  <main id="viewport">
    <div id="canvas"></div>

    <div id="empty-state" class="empty-state" hidden>
      <p>Nenhum arquivo <code>.html</code> nesta pasta.</p>
      <p class="muted">Crie um e ele aparece aqui sozinho.</p>
    </div>

    <div class="toolbar">
      <div class="global-size">
        <button type="button" data-action="global-size" aria-expanded="false"
          title="Tamanho de todas as telas">⤡</button>
        <div id="global-size-menu" class="global-size-menu"></div>
      </div>
      <span class="toolbar-divider"></span>
      <button type="button" data-action="zoom-out" title="Diminuir zoom">−</button>
      <button type="button" data-action="zoom-reset" title="Zoom 100% (tecla 1)"><span id="zoom-label">100%</span></button>
      <button type="button" data-action="zoom-in" title="Aumentar zoom">+</button>
      <span class="toolbar-divider"></span>
      <button type="button" data-action="fit" title="Enquadrar tudo (tecla 0)">Enquadrar</button>
      <button type="button" data-action="rearrange" title="Descartar as posições salvas e voltar ao layout automático">Reorganizar</button>
      <button type="button" data-action="toggle-snap" aria-pressed="false" title="Alinhar telas a uma grade ao arrastar">Grade</button>
      <span class="toolbar-divider"></span>
      <button type="button" data-action="toggle-mode" aria-pressed="false" title="Modo ponteiro: destacar elementos ao passar o mouse (senão: mover o board)">Ponteiro</button>
    </div>

  </main>

  <dialog id="settings-dialog">
    <div id="settings-header">
      <h2>Configuracoes</h2>
      <button type="button" id="settings-close" title="Fechar">×</button>
    </div>

    <div id="settings-body">
      <nav id="settings-nav">
        <button type="button" class="settings-nav-item" data-category="general">General</button>
        <button type="button" class="settings-nav-item" data-category="models">Models</button>
        <nav id="settings-model-nav">
          <button type="button" class="settings-nav-item settings-nav-subitem"
            data-model-category="claude">Claude</button>
        </nav>
      </nav>

      <div id="settings-panels">
        <div id="settings-panel-general" class="settings-panel">
          <p class="muted">Nenhuma configuracao geral por aqui ainda.</p>
        </div>

        <div id="settings-panel-models" class="settings-panel" hidden>
          <div id="settings-model-panel-claude" class="settings-model-panel">
            <input type="password" id="chat-key-input" placeholder="Chave de API da Anthropic">
            <button type="button" id="chat-key-save">Salvar</button>
            <p id="chat-credential-note" class="chat-credential-note" hidden></p>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/app/board.js"></script>
</body>
</html>
